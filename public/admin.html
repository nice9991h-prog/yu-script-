<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YU💠 Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section id="login" class="glass auth"><p class="eyebrow">YU💠 CONTROL CENTER</p><h1>Admin Login</h1><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="button" id="loginBtn">Sign in</button><p id="loginError" class="error"></p></section><section id="panel" hidden><header class="admin-head"><div><p class="eyebrow">YU💠 CONTROL CENTER</p><h1>Dashboard</h1></div><button class="button secondary" id="logout">Log out</button></header><div id="dash" class="dash"></div><div class="admin-grid"><section class="glass admin-card"><h2>Products</h2><form id="productForm"><input name="name" required placeholder="Product name"><textarea name="description" required placeholder="Description"></textarea><div class="two"><input name="price" type="number" min="0" step=".01" required placeholder="Price"><input name="stock" type="number" min="0" required placeholder="Stock"></div><input name="imageUrl" placeholder="Image URL"><input name="downloadUrl" placeholder="Download URL"><button class="button">Add product</button></form><div id="productList"></div></section><section class="glass admin-card"><h2>Orders</h2><div id="orders"></div><h2>Generated keys</h2><div id="keys"></div></section></div></section></main><script src="/admin.js"></script></body></html>
