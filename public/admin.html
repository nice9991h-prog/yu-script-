<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YU💠 Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="admin"><section id="login" class="glass auth"><h1>YU💠 Admin</h1><p>Secure creator dashboard</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="button" id="loginBtn">Sign in</button><p id="loginError" class="error"></p></section><section id="panel" hidden><header class="admin-head"><div><p class="eyebrow">CONTROL CENTER</p><h1>Dashboard</h1></div><button class="button ghost" id="logout">Log out</button></header><div class="dash" id="dash"></div><div class="admin-grid"><section class="glass"><h2>Products</h2><form id="productForm"><input name="name" placeholder="Name" required><input name="category" placeholder="Category (Scripts/UI/Tools/Premium)" required><textarea name="description" placeholder="Description" required></textarea><div class="two"><input name="price" type="number" step=".01" placeholder="Price" required><input name="stock" type="number" placeholder="Stock" required></div><input name="imageUrl" placeholder="Image URL"><input name="downloadUrl" placeholder="Download URL"><button class="button">Add product</button></form><div id="productList"></div></section><section class="glass"><h2>Orders & Keys</h2><div id="orders"></div><h2>Site settings</h2><form id="settings"><input name="logo" placeholder="Logo"><input name="title" placeholder="Title"><input name="bio" placeholder="Bio"><div class="two"><input name="projects" placeholder="Projects"><input name="likes" placeholder="Likes"></div><input name="comments" placeholder="Comments"><textarea name="payment_instructions" placeholder="Payment instructions"></textarea><input name="payment_qr_url" placeholder="Payment QR URL"><button class="button">Save settings</button></form></section></div></section></main><script>const $=s=>document.querySelector(s),api=async(u,o)=>{let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d};function formData(f){return Object.fromEntries(new FormData(f))}async function refresh(){const d=await api('/api/admin/dashboard');$('#dash').innerHTML=[['Products',d.products],['Total stock',d.stock],['Orders',d.orders.length],['Paid orders',d.paidOrders],['Available keys',d.availableKeys],['Used keys',d.usedKeys]].map(x=>`<div class="glass metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('#productList').innerHTML=d.products.map(p=>`<div class="admin-row"><b>${p.name}</b><span>$${(p.price/100).toFixed(2)} · ${p.stock} stock</span><button data-del="${p.id}" class="danger">Delete</button></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api('/api/admin/products/'+b.dataset.del,{method:'DELETE'});refresh()});$('#orders').innerHTML=d.orders.map(o=>`<div class="admin-row"><span><b>${o.name}</b><br><small>${o.id.slice(0,8)}… · ${o.status}</small></span><span><select data-status="${o.id}"><option>Pending</option><option>Paid</option><option>Failed</option><option>Cancelled</option></select><button data-key="${o.id}" class="button mini">Create key</button></span></div>`).join('');d.orders.forEach(o=>{let s=document.querySelector(`[data-status="${o.id}"]`);s.value=o.status;s.onchange=()=>api('/api/admin/orders/'+o.id+'/status',{method:'POST',body:JSON.stringify({status:s.value})}).then(refresh);let k=document.querySelector(`[data-key="${o.id}"]`);k.onclick=()=>api('/api/admin/keys',{method:'POST',body:JSON.stringify({orderId:o.id})}).then(x=>alert('Key: '+x.key)).catch(e=>alert(e.message))});for(const [k,v] of Object.entries(d.settings)){const e=$(`#settings [name="${k}"]`);if(e)e.value=v}}$('#loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});$('#login').hidden=true;$('#panel').hidden=false;refresh()}catch(e){$('#loginError').textContent=e.message}};$('#logout').onclick=()=>api('/api/admin/logout',{method:'POST'}).then(()=>location.reload());$('#productForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/products',{method:'POST',body:JSON.stringify(formData(e.target))});e.target.reset();refresh()};$('#settings').onsubmit=async e=>{e.preventDefault();await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(formData(e.target))});alert('Saved')};</script></body></html>
